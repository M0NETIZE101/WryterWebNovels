<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Story — Wryter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="/" class="wordmark">Wryter<span class="dot">.</span></a>
    <nav class="nav">
      <a href="/">← All stories</a>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">☾</button>
    </nav>
  </div>
</header>

<main>
  <section class="story-head" id="story-head">
    <div class="wrap">
      <div class="layout" id="story-layout">
        <div class="cover-lg" id="story-cover"></div>
        <div class="info" id="story-info">
          <p style="color:var(--text-muted)">Loading…</p>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <h2>Chapters</h2>
        <span class="meta" id="chapter-count" style="color:var(--text-muted)"></span>
      </div>
      <ul class="chapter-list" id="chapter-list"></ul>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© <span id="year"></span> Wryter</span>
    <span>Built with Supabase &amp; Cloudflare</span>
  </div>
</footer>

<script type="module" src="story.js"></script>
</body>
</html>
